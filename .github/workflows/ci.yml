name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Formatting and lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Test
        run: bun test packages

  build:
    name: Build for publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack every package
        run: bun run scripts/pack.ts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: .artifacts/*.tgz
          if-no-files-found: error

  node:
    name: Works under Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The engine is runtime-agnostic, and the CLI uses `node:` built-ins
      # only. A consumer on Node should get the same answers, so the built
      # bundle is exercised there rather than only under Bun.
      - name: Lint a document with the built bundle
        run: node scripts/smoke.mjs
