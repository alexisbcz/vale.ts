name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # Nothing is published that does not pass. A broken release is worse than
      # a late one.
      - name: Test
        run: bun test packages

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun run scripts/check-version.ts "${GITHUB_REF_NAME#v}"

      - name: Publish
        if: ${{ github.event.inputs.dry-run != 'true' }}
        run: bun run scripts/publish.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack only
        if: ${{ github.event.inputs.dry-run == 'true' }}
        run: bun run scripts/pack.ts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: .artifacts/*.tgz
          if-no-files-found: warn
